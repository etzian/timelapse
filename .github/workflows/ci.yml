name: CI

on:
  push:
    branches: [main, 'phase-*']
  pull_request:

permissions:
  contents: read
  packages: read

# Scope: cargo fmt/clippy/test, svelte-check, vitest, vite build, the
# project invariant checks (scripts/verify.sh) and a Tauri build. The
# `ez i18n-check` / `ez legal check` / `ez licence-audit` targets are not
# included because the `ez` CLI lives in `~/etzian/_foundation`, which is
# not part of this repository's checkout; those three already pass on the
# dev machine via `make gate` (see CLAUDE.md), and are the canonical place
# to run them. Do NOT weaken this workflow to "fix" a local-tool gap.
jobs:
  build-macos-aarch64:
    name: Build + check (aarch64-apple-darwin)
    runs-on: macos-latest
    timeout-minutes: 75
    env:
      # Private @etzianco/ui package lives in GitHub Packages under the etzianco
      # org. The workflow github.token cannot be used — it lacks read access to
      # the org's packages (403 "installation does not exist"), which is what
      # blocked the first two CI runs. Use a Classic/Fine-Grained PAT saved as
      # the `NPM_TOKEN` repository secret, scoped to read:packages on the
      # etzianco org. The Makefile already passes NODE_AUTH_TOKEN to npm, so we
      # only set that here; nothing is hard-coded in this file.
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Install stable Rust (project pins via rust-toolchain.toml)
        run: rustup component add rustfmt clippy

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install the Tauri CLI (cargo binary, pinned to src-tauri's version)
        run: cargo install tauri-cli --version 2.9.6 --locked

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # ---- FFmpeg (ADR-017, ADR-022): pinned LGPL build, cached by its pins/scripts ----
      - name: Cache the FFmpeg build
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg-dist
          key: ffmpeg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build-ffmpeg/**') }}

      - name: Build FFmpeg 9.0.2 + SVT-AV1 4.2.0 (LGPL, shared)
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash tools/build-ffmpeg/build.sh ffmpeg-dist

      - name: Licence assertion on the FFmpeg we ship (no GPL, committed encoders)
        run: bash tools/build-ffmpeg/check-licence.sh ffmpeg-dist

      - name: Bundle FFmpeg into the app resources
        run: |
          mkdir -p src-tauri/resources/ffmpeg
          cp -R ffmpeg-dist/bin ffmpeg-dist/lib ffmpeg-dist/LICENSES src-tauri/resources/ffmpeg/
          echo "TIMELAPSE_FFMPEG_DIR=$PWD/ffmpeg-dist" >> "$GITHUB_ENV"

      - name: Rust workspace check (fmt + clippy -D warnings + test, encode tests included)
        run: make check

      - name: Encode tests, verbose (real MP4s per tier, validated with ffprobe)
        run: cargo test -p timelapse-core export:: -- --nocapture

      - name: Frontend check (svelte-check --fail-on-warnings + vitest + vite build)
        run: make ui-check

      - name: Build the unsigned .app (signing is added once a team_id exists)
        run: make build

      - name: Upload FFmpeg binaries, licences and exact sources (LGPL §6)
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-9.0.2-lgpl-aarch64
          path: ffmpeg-dist
          if-no-files-found: error

      - name: Upload the built .app for inspection
        uses: actions/upload-artifact@v4
        with:
          name: timelapse-app-aarch64
          path: target/aarch64-apple-darwin/release/bundle/macos/*.app
          include-hidden-files: true
          if-no-files-found: warn
