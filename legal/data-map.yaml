# Data map (schema: ~/etzian/_foundation/legal/schema/data-map.schema.yaml).
# The starting point describes the sample app: everything stays on the device.
# Change this file in the SAME commit as any change that stores or sends more
# (a network call, an SDK, an account, analytics, sync), then run
# `ez legal check .` and `ez legal gen .`. Quote texts that contain commas.
app:
  slug: timelapse
  name: "Timelapse Studio"
  archetype: standalone
  store_distribution: [direct]
policy:
  effective_date: "2026-11-10"
  data_leaves_device: false
  summary:
    fr-CA: "Transformez d'importants fichiers de photos en vidéos timelapse de haute qualité, localement."
    en: "Turn large photo collections into high-quality timelapse videos, locally."
audience:
  minimum_age: 0
  directed_at_children: false
features:
  account: false
  analytics: false
  cookies: false
  cloud_sync: false
data:
  - id: app-settings
    label: { fr-CA: "Vos choix de langue, de thème et de densité", en: "Your language, theme and density choices" }
    category: other
    purpose: { fr-CA: "Afficher l'application comme vous l'avez choisi", en: "Show the app the way you chose" }
    basis: necessary-for-service
    storage: { location: device }
    retention: { fr-CA: "Jusqu'à ce que vous effaciez les données de l'application", en: "Until you erase the app's data" }
  - id: images-inventory
    label: { fr-CA: "L'inventaire de vos photographies (chemins, tailles, hachage SHA-256 et statut d'import)", en: "Your photograph inventory (paths, sizes, SHA-256 hash and import status)" }
    category: other
    purpose: { fr-CA: "Indexer, dédoublonner et retrouver vos photographies entre les séances de travail", en: "Index, deduplicate and find your photographs across working sessions" }
    basis: necessary-for-service
    storage: { location: device }
    retention: { fr-CA: "Jusqu'à ce que vous supprimiez la base de données du projet (dossier .timelapse/)", en: "Until you delete the project's database (.timelapse/ folder)" }
  - id: capture-timeline
    label: { fr-CA: "Les dates de prise de vue de vos photographies (dates EXIF, date lue dans le nom du fichier, date du fichier, fuseau horaire consigné)", en: "Your photographs' capture dates (EXIF dates, date read from the file name, file date, recorded time zone)" }
    category: other
    purpose: { fr-CA: "Classer vos photographies en ordre chronologique et repérer les intervalles dans la prise de vue", en: "Put your photographs in chronological order and find gaps in the shooting" }
    basis: necessary-for-service
    storage: { location: device }
    retention: { fr-CA: "Jusqu'à ce que vous supprimiez la base de données du projet (dossier .timelapse/)", en: "Until you delete the project's database (.timelapse/ folder)" }
  - id: cleaning-analysis
    label: { fr-CA: "Les mesures de luminosité de vos photographies, la cote Lightroom lue dans leurs métadonnées XMP, vos seuils et vos décisions (conserver, rejeter)", en: "Your photographs' brightness measurements, the Lightroom rating read from their XMP metadata, your thresholds and your decisions (keep, reject)" }
    category: other
    purpose: { fr-CA: "Repérer les photographies trop sombres ou rejetées et garder une trace reproductible de chaque décision de nettoyage", en: "Find photographs that are too dark or were rejected, and keep a reproducible record of every cleaning decision" }
    basis: necessary-for-service
    storage: { location: device }
    retention: { fr-CA: "Jusqu'à ce que vous supprimiez la base de données du projet (dossier .timelapse/)", en: "Until you delete the project's database (.timelapse/ folder)" }
  - id: quarantine-journal
    label: { fr-CA: "Les photographies que vous mettez en quarantaine (déplacées dans .timelapse/quarantine/) et le journal de chaque déplacement et restauration (chemins, empreinte, statut)", en: "The photographs you quarantine (moved into .timelapse/quarantine/) and the journal of every move and restore (paths, hash, status)" }
    category: other
    purpose: { fr-CA: "Permettre de restaurer en tout temps une photographie mise en quarantaine, sans perte de données", en: "Let you restore a quarantined photograph at any time, without data loss" }
    basis: necessary-for-service
    storage: { location: device }
    retention: { fr-CA: "Jusqu'à ce que vous restauriez la photographie ou supprimiez vous-même le dossier .timelapse/ du projet; rien n'est supprimé automatiquement", en: "Until you restore the photograph or delete the project's .timelapse/ folder yourself; nothing is deleted automatically" }
  - id: review-thumbnails
    label: { fr-CA: "Des vignettes de vos photographies (dossier .timelapse/thumbs/)", en: "Thumbnails of your photographs (.timelapse/thumbs/ folder)" }
    category: other
    purpose: { fr-CA: "Afficher rapidement les photographies à examiner", en: "Show the photographs to review quickly" }
    basis: necessary-for-service
    storage: { location: device }
    retention: { fr-CA: "Jusqu'à ce que vous supprimiez la base de données du projet (dossier .timelapse/)", en: "Until you delete the project's database (.timelapse/ folder)" }
  - id: sampling-runs
    label: { fr-CA: "Vos sélections d'échantillonnage enregistrées (méthode, réglages, liste ordonnée des photographies retenues et empreinte des photographies disponibles)", en: "Your saved sampling selections (method, settings, ordered list of the selected photographs and a fingerprint of the available photographs)" }
    category: other
    purpose: { fr-CA: "Produire la vidéo à partir d'une séquence exacte et reproductible", en: "Make the video from an exact, reproducible sequence" }
    basis: necessary-for-service
    storage: { location: device }
    retention: { fr-CA: "Jusqu'à ce que vous supprimiez la base de données du projet (dossier .timelapse/)", en: "Until you delete the project's database (.timelapse/ folder)" }
  - id: video-exports
    label: { fr-CA: "Les vidéos que vous créez (dossier .timelapse/exports/) et le journal de chaque exportation (réglages, version de FFmpeg, commande, résultat)", en: "The videos you create (.timelapse/exports/ folder) and the record of each export (settings, FFmpeg version, command, result)" }
    category: other
    purpose: { fr-CA: "Produire votre vidéo timelapse et pouvoir la reproduire à l'identique", en: "Make your timelapse video and be able to reproduce it exactly" }
    basis: necessary-for-service
    storage: { location: device }
    retention: { fr-CA: "Jusqu'à ce que vous supprimiez vous-même les vidéos ou le dossier .timelapse/ du projet", en: "Until you delete the videos or the project's .timelapse/ folder yourself" }
  - id: consolidations
    label: { fr-CA: "Les copies ou originaux placés dans le dossier de travail que vous choisissez, et le journal de chaque organisation (dossier de travail, réglages, chemins d'origine et de destination, empreintes des fichiers, résultat)", en: "The copies or originals placed in the working folder you choose, and the record of each organization (working folder, settings, source and target paths, file fingerprints, result)" }
    category: other
    purpose: { fr-CA: "Regrouper vos photographies dans un dossier de travail, vérifier les fichiers et pouvoir annuler l'opération", en: "Gather your photographs into a working folder, verify the files and be able to undo the operation" }
    basis: necessary-for-service
    storage: { location: device }
    retention: { fr-CA: "Les fichiers placés restent jusqu'à ce que vous annuliez l'organisation ou les supprimiez vous-même; le journal reste jusqu'à ce que vous supprimiez le dossier .timelapse/ du projet", en: "Placed files stay until you undo the organization or delete them yourself; the record stays until you delete the project's .timelapse/ folder" }
  - id: contact-sheets
    label: { fr-CA: "Les planches contact que vous générez (fichiers PDF dans .timelapse/contact-sheets/, avec des vignettes, les noms de fichiers et les heures de prise de vue) et le registre de chaque planche (source, mise en page, textes, résultat)", en: "The contact sheets you generate (PDF files in .timelapse/contact-sheets/, with thumbnails, file names and capture times) and the record of each sheet (source, layout, texts, result)" }
    category: other
    purpose: { fr-CA: "Vous permettre de revoir et de partager visuellement une sélection de photographies", en: "Let you review and share a selection of photographs visually" }
    basis: necessary-for-service
    storage: { location: device }
    retention: { fr-CA: "Jusqu'à ce que vous supprimiez vous-même les planches ou le dossier .timelapse/ du projet", en: "Until you delete the sheets or the project's .timelapse/ folder yourself" }
security_measures:
  - fr-CA: "Vos données restent sur votre appareil et ne sont transmises à personne."
    en: "Your data stays on your device and is sent to no one."
  - fr-CA: "L'application ne charge que son propre contenu (politique de sécurité du contenu restrictive)."
    en: "The app loads only its own content (restrictive content security policy)."
rights_workflow: { self_service_export: false, self_service_deletion: true, response_days: 30 }
commercial:
  # Phase 0: shipping free so the legal gate passes without company.neq (empty
  # in _foundation/company/etzian.yaml). PRODUCT INTENT is a one-time purchase
  # (per user decision 2026-11-09) — flip this back to `model: one-time` and
  # fill `company.neq` via `ez profile` before release. Re-run `ez legal gen .`.
  # `billing: direct` is the schema's minimum for a user-facing app; free +
  # direct simply means no checkout, no payment processor.
  model: free
  billing: direct
  refund_days: 0
apple:
  tracking: false
  # Verify against a RELEASE build (Xcode privacy report) before submitting;
  # add every required-reason API the code or a dependency really calls.
  required_reason_apis:
    - category: NSPrivacyAccessedAPICategoryFileTimestamp
      reasons: [C617.1]
