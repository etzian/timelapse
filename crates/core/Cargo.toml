[package]
name = "timelapse-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Timelapse Studio — pure logic, no tauri dependency"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Phase 1 additions. All permissive-licenced; see `docs/DECISIONS.md` open-decisions note.
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"

# Phase 2 — EXIF & timeline (ADR-019). kamadak-exif is BSD-2-Clause, time is
# MIT/Apache-2.0; both on the licence allow-list, no exception entry required.
kamadak-exif = "0.5"
time = "0.3"

# Phase 3 — brightness analysis & cleaning (ADR-020). Both MIT OR Apache-2.0; only the
# formats we import are compiled in.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
rayon = "1"

# Phase 6 follow-up (ADR-023, approved 2026-11-15). MIT OR Apache-2.0: names that differ
# only in Unicode normalisation (NFC vs NFD, as macOS may store them) compare equal.
unicode-normalization = "0.1"

# Phase 6 — consolidation (ADR-023). MIT OR Apache-2.0, already in the lockfile through
# Tauri: `clonefile` (APFS copy-on-write clones, macOS) and `statvfs` (free space).
[target.'cfg(unix)'.dependencies]
libc = "0.2"
