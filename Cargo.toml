[workspace]
resolver = "2"
members = ["crates/core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.90"
license = "UNLICENSED"
publish = false

# `make dev` builds our crates quickly but the dependencies optimised: SHA-256 (import),
# JPEG decoding (analysis, thumbnails) and SQLite are otherwise many times slower.
[profile.dev.package."*"]
opt-level = 2
